<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="Professional PWA — Modern Enterprise Application" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <title>ProPWA — Enterprise</title>

  <style>
    /* ─────────────────────────────────────────────
       DESIGN TOKENS — Obsidian Luxe Aesthetic
    ───────────────────────────────────────────── */
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --border: rgba(255, 255, 255, 0.07);
      --border2: rgba(255, 255, 255, 0.13);
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --accent3: #38bdf8;
      --text: #e8e8f0;
      --text2: #9090a8;
      --text3: #55556a;
      --success: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
      --radius: 18px;
      --radius-sm: 10px;
      --shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
      --shadow-sm: 0 2px 16px rgba(0, 0, 0, 0.35);
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --font-display: 'DM Serif Display', 'Georgia', serif;
      --font-body: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --easing: cubic-bezier(0.23, 1, 0.32, 1);
      --easing-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ── Reset ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Google Fonts fallback via @import ── */
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap');

    /* ── Noise texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.4;
    }

    /* ── Layout ── */
    #app {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
    }

    /* ── Header ── */
    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }

    #header .logo {
      font-family: var(--font-display);
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent2) 0%, var(--accent3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      user-select: none;
    }

    #header .tagline {
      margin-left: 12px;
      font-size: 0.72rem;
      color: var(--text3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      display: none;
    }

    @media(min-width:480px) {
      #header .tagline {
        display: block;
      }
    }

    /* ── Main content area ── */
    #main {
      padding-top: 64px;
      min-height: 100dvh;
    }

    /* ── Page container ── */
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 80px;
      animation: pageFadeIn 0.4s var(--easing) both;
    }

    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Section heading ── */
    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text3);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s var(--easing), box-shadow 0.25s var(--easing), border-color 0.25s;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--glass) 0%, transparent 60%);
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--border2);
    }

    /* ── Grid ── */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s var(--easing-spring);
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0);
      transition: background 0.2s;
    }

    .btn:hover::after {
      background: rgba(255, 255, 255, 0.07);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      color: #fff;
      box-shadow: 0 4px 20px rgba(108, 99, 255, 0.35);
    }

    .btn-primary:hover {
      box-shadow: 0 8px 30px rgba(108, 99, 255, 0.5);
    }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--border2);
    }

    .btn-sm {
      padding: 6px 14px;
      font-size: 0.8rem;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      justify-content: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      border-radius: 12px;
    }

    .btn-icon:hover {
      color: var(--text);
    }

    /* ── Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .badge-granted {
      background: rgba(52, 211, 153, 0.12);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.25);
    }

    .badge-denied {
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }

    .badge-prompt {
      background: rgba(251, 191, 36, 0.12);
      color: var(--warn);
      border: 1px solid rgba(251, 191, 36, 0.25);
    }

    .badge-unknown {
      background: var(--surface2);
      color: var(--text3);
      border: 1px solid var(--border);
    }

    .badge-unsupported {
      background: var(--surface2);
      color: var(--text3);
      border: 1px solid var(--border);
    }

    /* ── Dot indicator ── */
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-granted {
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    .dot-denied {
      background: var(--danger);
    }

    .dot-prompt {
      background: var(--warn);
    }

    .dot-unknown,
    .dot-unsupported {
      background: var(--text3);
    }

    /* ── Hero home ── */
    .hero {
      padding: 60px 0 32px;
      text-align: center;
    }

    .hero-kicker {
      display: inline-block;
      margin-bottom: 16px;
      padding: 4px 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(108, 99, 255, 0.15), rgba(56, 189, 248, 0.15));
      border: 1px solid rgba(108, 99, 255, 0.25);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent2);
      font-weight: 600;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 7vw, 4rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
      background: linear-gradient(160deg, var(--text) 0%, var(--text2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1rem;
      color: var(--text2);
      max-width: 480px;
      margin: 0 auto 32px;
      line-height: 1.65;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── Stat strip ── */
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin: 32px 0;
    }

    .stat-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      text-align: center;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 1.8rem;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text3);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── Loading spinner ── */
    #page-loader {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(10, 10, 15, 0.7);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
    }

    #page-loader.active {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border2);
      border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Floating Menu Button ── */
    #fab {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 300;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s var(--easing-spring);
      box-shadow: var(--shadow-sm);
      perspective: 300px;
    }

    #fab:hover {
      transform: translateY(-2px) scale(1.06);
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 8px 30px rgba(108, 99, 255, 0.4);
    }

    #fab.open {
      transform: rotate(45deg) scale(1.05);
      background: var(--accent);
      border-color: var(--accent);
    }

    #fab svg {
      transition: transform 0.3s var(--easing);
    }

    /* ── Dropdown Menu ── */
    #nav-menu {
      position: fixed;
      top: 60px;
      right: 14px;
      z-index: 299;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 8px;
      min-width: 210px;
      box-shadow: var(--shadow);
      transform-origin: top right;
      transform: scale(0.85) translateY(-12px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.28s var(--easing-spring), opacity 0.22s var(--easing);
    }

    #nav-menu.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: all;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text2);
      transition: all 0.18s var(--easing);
      position: relative;
      overflow: hidden;
    }

    .nav-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .nav-item:hover {
      color: var(--text);
      background: var(--surface2);
    }

    .nav-item.active {
      color: var(--accent2);
    }

    .nav-item .nav-icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.85rem;
      transition: all 0.2s var(--easing-spring);
    }

    .nav-item:hover .nav-icon {
      background: rgba(108, 99, 255, 0.2);
      transform: scale(1.1) rotate(-5deg);
    }

    .nav-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 0;
    }

    /* ── Install prompt banner ── */
    #install-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 250;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 14px 20px;
      box-shadow: var(--shadow);
      max-width: 340px;
      width: calc(100% - 32px);
      animation: slideUp 0.4s var(--easing-spring);
    }

    #install-banner.show {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .install-text {
      flex: 1;
      font-size: 0.85rem;
      color: var(--text2);
    }

    .install-text strong {
      display: block;
      color: var(--text);
      margin-bottom: 2px;
    }

    @keyframes slideUp {
      from {
        transform: translateX(-50%) translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 80px;
      right: 20px;
      z-index: 400;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      pointer-events: none;
    }

    .toast {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.82rem;
      color: var(--text);
      box-shadow: var(--shadow);
      animation: toastIn 0.35s var(--easing-spring) both;
      max-width: 280px;
    }

    .toast.out {
      animation: toastOut 0.3s var(--easing) forwards;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(20px) scale(0.9);
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateX(20px) scale(0.9);
      }
    }

    /* ── Permission Card ── */
    .perm-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      perspective: 600px;
      transition: transform 0.3s var(--easing), box-shadow 0.3s var(--easing), border-color 0.3s;
    }

    .perm-card:hover {
      transform: translateY(-3px) rotateX(1.5deg);
      box-shadow: var(--shadow), 0 0 0 1px var(--border2);
      border-color: var(--border2);
    }

    .perm-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .perm-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
      transition: all 0.3s var(--easing-spring);
    }

    .perm-card:hover .perm-icon-wrap {
      transform: scale(1.1) rotate(-8deg);
    }

    .perm-card.granted .perm-icon-wrap {
      background: rgba(52, 211, 153, 0.12);
      border-color: rgba(52, 211, 153, 0.25);
    }

    .perm-card.denied .perm-icon-wrap {
      background: rgba(248, 113, 113, 0.12);
      border-color: rgba(248, 113, 113, 0.25);
    }

    .perm-meta {
      flex: 1;
      min-width: 0;
    }

    .perm-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }

    .perm-desc {
      font-size: 0.75rem;
      color: var(--text3);
      line-height: 1.4;
    }

    .perm-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .perm-status-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.4s var(--easing);
    }

    /* ── Image Viewer ── */
    #viewer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(5, 5, 10, 0.94);
      backdrop-filter: blur(20px) saturate(150%);
      align-items: center;
      justify-content: center;
    }

    #viewer-overlay.show {
      display: flex;
    }

    .viewer-toolbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(10, 10, 15, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .viewer-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewer-zoom-label {
      font-size: 0.78rem;
      color: var(--text2);
      font-family: var(--font-mono);
      min-width: 48px;
      text-align: center;
    }

    .viewer-stage {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
    }

    .viewer-stage.dragging {
      cursor: grabbing;
    }

    .viewer-stage img {
      max-width: none;
      max-height: none;
      will-change: transform;
      transform-origin: center center;
      display: block;
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* ── Offline indicator ── */
    #offline-bar {
      display: none;
      position: fixed;
      top: 64px;
      left: 0;
      right: 0;
      z-index: 150;
      background: rgba(251, 191, 36, 0.12);
      border-bottom: 1px solid rgba(251, 191, 36, 0.25);
      padding: 8px 20px;
      font-size: 0.8rem;
      color: var(--warn);
      text-align: center;
      letter-spacing: 0.02em;
    }

    #offline-bar.show {
      display: block;
    }

    /* ── Feature card home ── */
    .feature-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s var(--easing);
    }

    .feature-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      transform: scaleX(0);
      transition: transform 0.4s var(--easing);
    }

    .feature-card:hover::after {
      transform: scaleX(1);
    }

    .feature-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: var(--border2);
    }

    .feature-card .fi {
      font-size: 2rem;
      margin-bottom: 14px;
      display: block;
    }

    .feature-card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .feature-card p {
      font-size: 0.8rem;
      color: var(--text2);
      line-height: 1.55;
    }

    /* ── Device orientation visual ── */
    #orientation-visual {
      width: 80px;
      height: 140px;
      border: 2px solid var(--border2);
      border-radius: 16px;
      margin: 0 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s var(--easing);
      background: var(--surface2);
    }

    #orientation-visual::before {
      content: '';
      width: 20px;
      height: 3px;
      border-radius: 2px;
      background: var(--border2);
      position: absolute;
      top: 10px;
    }

    /* ── Geolocation map placeholder ── */
    .geo-display {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text2);
      line-height: 1.7;
    }

    /* ── Media stream display ── */
    #camera-preview {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: block;
    }

    #audio-bar-wrap {
      height: 8px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }

    #audio-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--success), var(--accent3));
      border-radius: 4px;
      width: 0%;
      transition: width 0.1s linear;
    }

    /* ── Notification test area ── */
    .notification-preview {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text3);
      font-size: 0.75rem;
      border-top: 1px solid var(--border);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text3);
    }

    /* ── Utility ── */
    .flex {
      display: flex;
    }

    .items-center {
      align-items: center;
    }

    .gap-8 {
      gap: 8px;
    }

    .gap-12 {
      gap: 12px;
    }

    .gap-16 {
      gap: 16px;
    }

    .mt-8 {
      margin-top: 8px;
    }

    .mt-16 {
      margin-top: 16px;
    }

    .mt-24 {
      margin-top: 24px;
    }

    .mb-8 {
      margin-bottom: 8px;
    }

    .mb-16 {
      margin-bottom: 16px;
    }

    .text-sm {
      font-size: 0.82rem;
    }

    .text-xs {
      font-size: 0.72rem;
    }

    .text-muted {
      color: var(--text2);
    }

    .text-faint {
      color: var(--text3);
    }

    .mono {
      font-family: var(--font-mono);
    }

    .full-width {
      width: 100%;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- ── Offline bar ── -->
  <div id="offline-bar">⚡ You're offline — Cached content is being served</div>

  <!-- ── Header ── -->
  <header id="header">
    <div class="logo" onclick="router.navigate('/')" style="cursor:pointer">ProPWA</div>
    <span class="tagline">Enterprise Platform</span>
  </header>

  <!-- ── Floating Action Button ── -->
  <button id="fab" aria-label="Open navigation menu" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="5" x2="15" y2="5" />
      <line x1="3" y1="9" x2="15" y2="9" />
      <line x1="3" y1="13" x2="15" y2="13" />
    </svg>
  </button>

  <!-- ── Navigation Dropdown ── -->
  <nav id="nav-menu" role="navigation" aria-label="Main navigation">
    <div class="nav-item" data-page="/" data-label="Home">
      <span class="nav-icon">🏠</span>Home
    </div>
    <div class="nav-item" data-page="/permissions" data-label="Permissions">
      <span class="nav-icon">🔐</span>Permission Center
    </div>
    <div class="nav-item" data-page="/viewer" data-label="Viewer">
      <span class="nav-icon">🖼️</span>Image Viewer
    </div>
    <div class="nav-item" data-page="/device" data-label="Device">
      <span class="nav-icon">📱</span>Device Info
    </div>
    <div class="nav-divider"></div>
    <div class="nav-item" data-page="/offline" data-label="Offline">
      <span class="nav-icon">📡</span>Offline Demo
    </div>
  </nav>

  <!-- ── Main App ── -->
  <main id="main">
    <div id="page-content"></div>
  </main>

  <!-- ── Page loader ── -->
  <div id="page-loader" role="status" aria-live="polite">
    <div class="spinner"></div>
  </div>

  <!-- ── Toast container ── -->
  <div id="toast-container" aria-live="assertive"></div>

  <!-- ── Image Viewer Overlay ── -->
  <div id="viewer-overlay" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="viewer-toolbar">
      <span style="font-size:0.85rem;color:var(--text2)" id="viewer-filename">Image</span>
      <div class="viewer-controls">
        <button class="btn btn-icon btn-sm" id="btn-zoom-out" title="Zoom out">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="6" cy="6" r="5" />
            <line x1="3" y1="6" x2="9" y2="6" />
            <line x1="9.5" y1="9.5" x2="13" y2="13" />
          </svg>
        </button>
        <span class="viewer-zoom-label" id="zoom-label">100%</span>
        <button class="btn btn-icon btn-sm" id="btn-zoom-in" title="Zoom in">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="6" cy="6" r="5" />
            <line x1="6" y1="3" x2="6" y2="9" />
            <line x1="3" y1="6" x2="9" y2="6" />
            <line x1="9.5" y1="9.5" x2="13" y2="13" />
          </svg>
        </button>
        <button class="btn btn-icon btn-sm" id="btn-zoom-reset" title="Reset zoom">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 6a4 4 0 1 1 4 4H2" />
            <polyline points="2 10 2 6 6 6" />
          </svg>
        </button>
        <button class="btn btn-icon btn-sm" id="btn-viewer-close" title="Close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="2" y1="2" x2="12" y2="12" />
            <line x1="12" y1="2" x2="2" y2="12" />
          </svg>
        </button>
      </div>
    </div>
    <div class="viewer-stage" id="viewer-stage">
      <img id="viewer-img" src="" alt="Viewed image" draggable="false" />
    </div>
  </div>

  <!-- ── Install Banner ── -->
  <div id="install-banner" role="complementary">
    <div class="install-text">
      <strong>Install ProPWA</strong>
      Add to your home screen for the full experience
    </div>
    <button class="btn btn-primary btn-sm" id="btn-install">Install</button>
    <button class="btn btn-ghost btn-sm" id="btn-install-dismiss">✕</button>
  </div>

  <!-- ── App Core + External JS ── -->
  <script src="app.js"></script>

  <!-- ── Inline boot: register SW and init router ── -->
  <script>
    // Boot sequence — runs after app.js is loaded
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>

</html>
